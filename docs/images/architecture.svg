<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="70" y="60" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="0.3">AWS Cloud &amp; Kubernetes Enterprise Architecture Blueprint</text>
  <rect x="940" y="40" width="90" height="26" rx="13" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="955" y="58" fill="#047857" font-size="12" font-weight="600">PRODUCTION</text>
  <rect x="1040" y="40" width="90" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1058" y="58" fill="#1d4ed8" font-size="12" font-weight="600">AWS EKS</text>

  <!-- COLUMN 1: Edge & Ingress -->
  <rect x="40" y="110" width="220" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="40" y="110" width="220" height="40" rx="8" fill="#f1f5f9"/>
  <text x="60" y="136" fill="#0284c7" font-size="13" font-weight="700">1. EDGE &amp; INGRESS</text>

  <rect x="60" y="170" width="180" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="198" fill="#0f172a" font-size="14" font-weight="600">Amazon Route 53</text>
  <text x="75" y="222" fill="#64748b" font-size="11">DNS &amp; Health Checks</text>

  <rect x="60" y="260" width="180" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="288" fill="#0f172a" font-size="14" font-weight="600">CloudFront CDN</text>
  <text x="75" y="312" fill="#64748b" font-size="11">TLS 1.3 Edge Caching</text>

  <rect x="60" y="350" width="180" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="378" fill="#0f172a" font-size="14" font-weight="600">AWS WAF v2</text>
  <text x="75" y="402" fill="#64748b" font-size="11">Bot Control &amp; Rate Limit</text>

  <rect x="60" y="440" width="180" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="75" y="468" fill="#0f172a" font-size="14" font-weight="600">Network / ALB</text>
  <text x="75" y="492" fill="#64748b" font-size="11">Multi-AZ Ingress Router</text>

  <!-- COLUMN 2: VPC & EKS -->
  <rect x="290" y="110" width="450" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="290" y="110" width="450" height="40" rx="8" fill="#f1f5f9"/>
  <text x="310" y="136" fill="#d97706" font-size="13" font-weight="700">2. VPC &amp; KUBERNETES EKS CLUSTER</text>

  <rect x="310" y="170" width="410" height="180" rx="6" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <text x="330" y="198" fill="#1d4ed8" font-size="13" font-weight="600">Private App Subnet (Multi-AZ)</text>

  <rect x="330" y="215" width="170" height="60" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="345" y="240" fill="#0f172a" font-size="12" font-weight="600">App Pod (Replica 1)</text>
  <text x="345" y="260" fill="#64748b" font-size="10">HPA Autoscaling (CPU/RAM)</text>

  <rect x="530" y="215" width="170" height="60" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="545" y="240" fill="#0f172a" font-size="12" font-weight="600">App Pod (Replica 2)</text>
  <text x="545" y="260" fill="#64748b" font-size="10">Zero-Downtime Rolling Update</text>

  <rect x="330" y="285" width="370" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="345" y="315" fill="#334155" font-size="12" font-weight="600">EKS Managed Node Groups (Bottlerocket / AL2023)</text>

  <rect x="310" y="370" width="410" height="100" rx="6" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1"/>
  <text x="330" y="398" fill="#4338ca" font-size="13" font-weight="600">Terraform Infrastructure Modules (IaC)</text>
  <text x="330" y="425" fill="#475569" font-size="11">• Multi-AZ VPC with NAT Gateways and VPC Endpoints</text>
  <text x="330" y="445" fill="#475569" font-size="11">• AWS KMS Envelope Encryption &amp; IAM IRSA for Pod Security</text>

  <rect x="310" y="490" width="410" height="90" rx="6" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1"/>
  <text x="330" y="518" fill="#065f46" font-size="13" font-weight="600">Storage &amp; Data Security</text>
  <text x="330" y="545" fill="#475569" font-size="11">Encrypted EBS CSI Driver • AWS S3 Glacier LifeCycle • KMS CMK</text>

  <!-- COLUMN 3: CI/CD & Observability -->
  <rect x="770" y="110" width="390" height="490" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <rect x="770" y="110" width="390" height="40" rx="8" fill="#f1f5f9"/>
  <text x="790" y="136" fill="#db2777" font-size="13" font-weight="700">3. CI/CD GATES &amp; OBSERVABILITY</text>

  <rect x="790" y="170" width="350" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="810" y="196" fill="#0f172a" font-size="13" font-weight="600">GitHub Actions Pipeline</text>
  <text x="810" y="216" fill="#64748b" font-size="11">Automated Lint, Test, and Container Build</text>

  <rect x="790" y="245" width="350" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="810" y="271" fill="#0f172a" font-size="13" font-weight="600">Trivy &amp; Security Scanners</text>
  <text x="810" y="291" fill="#64748b" font-size="11">Vulnerability CVE Scanning &amp; SBOM Generation</text>

  <rect x="790" y="320" width="350" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="810" y="346" fill="#0f172a" font-size="13" font-weight="600">Sigstore Cosign &amp; SLSA Level 3</text>
  <text x="810" y="366" fill="#64748b" font-size="11">Cryptographic Container Signature &amp; Provenance</text>

  <rect x="790" y="395" width="350" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="810" y="421" fill="#0f172a" font-size="13" font-weight="600">Amazon ECR Private Registry</text>
  <text x="810" y="441" fill="#64748b" font-size="11">Immutable Tags &amp; Image Vulnerability Scanning</text>

  <rect x="790" y="470" width="350" height="110" rx="6" fill="#f8fafc" stroke="#bae6fd" stroke-width="1"/>
  <text x="810" y="498" fill="#0369a1" font-size="13" font-weight="600">Prometheus &amp; Grafana Observability</text>
  <text x="810" y="525" fill="#475569" font-size="11">• Real-time Node Exporter &amp; Kube-State-Metrics</text>
  <text x="810" y="545" fill="#475569" font-size="11">• Alertmanager PagerDuty/Slack Notification Tree</text>
  <text x="810" y="565" fill="#475569" font-size="11">• AWS CloudWatch Metrics &amp; FluentBit Logs</text>

  <!-- Connectors -->
  <line x1="260" y1="355" x2="290" y2="355" stroke="#0284c7" stroke-width="2" stroke-dasharray="4"/>
  <line x1="740" y1="355" x2="770" y2="355" stroke="#ea580c" stroke-width="2" stroke-dasharray="4"/>
</svg>